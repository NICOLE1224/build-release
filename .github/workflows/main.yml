name: x-wrt-rax3000m

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Official X-WRT tag; empty selects the newest tag.
        required: false
        type: string
      device:
        description: RAX3000M bootloader and partition layout.
        type: choice
        default: cmcc_rax3000m
        options:
          - cmcc_rax3000m
          - cmcc_rax3000m-emmc-ubootlayout
          - cmcc_rax3000m-nand-ubootlayout
  push:
    branches:
      - rax3000m
    paths:
      - .gitattributes
      - .github/workflows/main.yml
      - profiles/rax3000m/**
      - build.sh
      - upload.sh
      - prepare-custom-packages.sh

permissions:
  contents: write

concurrency:
  group: x-wrt-rax3000m-${{ inputs.device || 'cmcc_rax3000m' }}
  # A corrected push supersedes an obsolete build of the same RAX3000M layout.
  cancel-in-progress: ${{ github.event_name == 'push' }}

jobs:
  build:
    if: github.ref == 'refs/heads/rax3000m'
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - name: Checkout RAX3000M build definition
        uses: actions/checkout@v7

      - name: Resolve official release and device
        id: release
        env:
          INPUT_RELEASE_TAG: ${{ inputs.release_tag }}
          INPUT_DEVICE: ${{ inputs.device }}
        run: |
          set -eu
          release_tag="${INPUT_RELEASE_TAG}"
          device="${INPUT_DEVICE:-cmcc_rax3000m}"
          case "$device" in
            cmcc_rax3000m|cmcc_rax3000m-emmc-ubootlayout|cmcc_rax3000m-nand-ubootlayout) ;;
            *) echo "Unsupported RAX3000M device" >&2; exit 1 ;;
          esac
          if [ -z "$release_tag" ]; then
            release_tag="$(
              git ls-remote --tags --refs https://github.com/x-wrt/x-wrt.git |
                awk -F/ '{print $3}' |
                grep -E '^[0-9]+[.][0-9]+_b[0-9]{12}$' |
                sort -V | tail -n 1
            )"
          fi
          printf '%s\n' "$release_tag" | grep -Eq '^[0-9]+[.][0-9]+_b[0-9]{12}$'
          source_commit="$(
            git ls-remote --tags https://github.com/x-wrt/x-wrt.git \
              "refs/tags/${release_tag}" "refs/tags/${release_tag}^{}" |
              awk '$2 ~ /\^\{\}$/ { peeled = $1 } $2 !~ /\^\{\}$/ { tag = $1 }
                   END { if (peeled != "") print peeled; else print tag }'
          )"
          test -n "$source_commit"
          {
            echo "release_tag=$release_tag"
            echo "source_commit=$source_commit"
            echo "device=$device"
            echo "asset_tag=rax3000m-${release_tag}-${device}"
          } >>"$GITHUB_OUTPUT"

      - name: Initialize build environment
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo -E apt-get update
          sudo rm -rf /opt/hostedtoolcache /opt/ghc /usr/local/.ghcup \
            /usr/local/lib/android /usr/share/swift /usr/share/dotnet /etc/mysql /etc/php
          sudo -E apt-get -y --no-install-recommends install \
            bc bison build-essential bzip2 ca-certificates curl file flex \
            gawk gettext git jq libelf-dev libncurses-dev libssl-dev \
            patch perl pigz pkgconf python3 python3-dev python3-setuptools \
            rsync swig texinfo unzip wget xz-utils zlib1g-dev zstd
          sudo -E apt-get clean
          sudo rm -rf /var/lib/apt/lists/*
          df -h /

      - name: Clone exact official source
        env:
          RELEASE_TAG: ${{ steps.release.outputs.release_tag }}
          EXPECTED_COMMIT: ${{ steps.release.outputs.source_commit }}
        run: |
          git clone --depth 1 --branch "$RELEASE_TAG" https://github.com/x-wrt/x-wrt.git x-wrt
          test "$(git -C x-wrt rev-parse HEAD)" = "$EXPECTED_COMMIT"

      - name: Install matching official feeds
        run: |
          cd x-wrt
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Apply RAX3000M applications and configuration
        env:
          RELEASE_TAG: ${{ steps.release.outputs.release_tag }}
          DEVICE: ${{ steps.release.outputs.device }}
        run: |
          python3 -B profiles/rax3000m/test_configure.py
          sh prepare-custom-packages.sh x-wrt
          sh profiles/rax3000m/configure.sh x-wrt "$RELEASE_TAG" "$DEVICE"
          sh profiles/rax3000m/write-provenance.sh x-wrt "$RELEASE_TAG" "$DEVICE" build-manifest.txt
          cp x-wrt/.config rax3000m.config

      - name: Check build prerequisites
        run: make -C x-wrt prereq

      - name: Build RAX3000M firmware
        env:
          CONFIG_VERSION_NUMBER: ${{ steps.release.outputs.release_tag }}
          RAX3000M_DEVICE: ${{ steps.release.outputs.device }}
        run: |
          cp build.sh upload.sh x-wrt/
          cd x-wrt
          bash build.sh "$(nproc)"

      - name: Upload failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: rax3000m-failure-${{ github.run_id }}
          include-hidden-files: true
          path: |
            make.log
            x-wrt/logs/
            x-wrt/.config
            x-wrt/tmp/.config-package.in
            x-wrt/tmp/.packageinfo
            build-manifest.txt
          if-no-files-found: warn

      - name: Upload firmware and configuration artifact
        uses: actions/upload-artifact@v7
        with:
          name: x-wrt-rax3000m-${{ steps.release.outputs.release_tag }}-${{ steps.release.outputs.device }}
          path: |
            x-wrt/rom/
            rax3000m.config
            build-manifest.txt
          if-no-files-found: error

      - name: Publish RAX3000M release assets
        uses: ncipollo/release-action@v1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          tag: ${{ steps.release.outputs.asset_tag }}
          commit: ${{ github.sha }}
          name: X-WRT RAX3000M ${{ steps.release.outputs.release_tag }} (${{ steps.release.outputs.device }})
          artifacts: x-wrt/rom/*.bin,x-wrt/rom/*.itb,x-wrt/rom/sha256-*.sum,build-manifest.txt
          allowUpdates: true
          replacesArtifacts: true
          artifactErrorsFailBuild: true
