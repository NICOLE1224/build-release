name: x-wrt-tenda-be12-pro

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Official x-wrt/x-wrt release tag; empty selects the newest tag.
        required: false
        type: string
  schedule:
    - cron: '17 * * * *'

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout build definition
        uses: actions/checkout@v6
        with:
          ref: tenda-be12-pro

      - name: Resolve official release
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_RELEASE_TAG: ${{ inputs.release_tag }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -eu

          release_tag="${INPUT_RELEASE_TAG}"
          if [ -z "${release_tag}" ]; then
            release_tag="$(
              git ls-remote --tags --refs https://github.com/x-wrt/x-wrt.git |
                awk -F/ '{print $3}' |
                grep -E '^[0-9]+[.][0-9]+_b[0-9]{12}$' |
                sort -V |
                tail -n 1
            )"
          fi

          printf '%s\n' "${release_tag}" |
            grep -Eq '^[0-9]+[.][0-9]+_b[0-9]{12}$'

          tag_refs="$(
            git ls-remote --tags https://github.com/x-wrt/x-wrt.git \
              "refs/tags/${release_tag}" "refs/tags/${release_tag}^{}"
          )"
          source_commit="$(
            printf '%s\n' "${tag_refs}" |
              awk '$2 ~ /\^\{\}$/ { peeled = $1 } $2 !~ /\^\{\}$/ { tag = $1 }
                   END { if (peeled != "") print peeled; else print tag }'
          )"
          test -n "${source_commit}"

          sing_box_tag="$(
            gh api -H 'X-GitHub-Api-Version: 2022-11-28' \
              repos/SagerNet/sing-box/releases/latest \
              --jq 'select(.draft == false and .prerelease == false) | .tag_name'
          )"
          printf '%s\n' "${sing_box_tag}" |
            grep -Eq '^v[0-9]+[.][0-9]+[.][0-9]+$'
          sing_box_version="${sing_box_tag#v}"

          should_build=true
          if [ "${EVENT_NAME}" = schedule ]; then
            manifest_dir="$(mktemp -d)"
            if gh release download "${release_tag}" \
                 --repo "${GITHUB_REPOSITORY}" \
                 --pattern build-manifest.txt \
                 --dir "${manifest_dir}" >/dev/null 2>&1 &&
               grep -Fq "sing-box latest-stable ${sing_box_version} " \
                 "${manifest_dir}/build-manifest.txt"; then
              should_build=false
            fi
          fi

          {
            echo "release_tag=${release_tag}"
            echo "source_commit=${source_commit}"
            echo "sing_box_tag=${sing_box_tag}"
            echo "should_build=${should_build}"
          } >>"${GITHUB_OUTPUT}"

      - name: Report existing release
        if: steps.release.outputs.should_build == 'false'
        run: echo "Release already contains the current X-WRT and Sing-box versions."

      - name: Initialize environment
        if: steps.release.outputs.should_build == 'true'
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo -E apt-get update
          sudo -E apt-get -y install git
          sudo rm -rf \
            /opt/hostedtoolcache \
            /opt/ghc \
            /usr/local/.ghcup \
            /usr/local/lib/android \
            /usr/share/swift \
            /usr/share/dotnet \
            /etc/mysql \
            /etc/php
          sudo -E apt-get -y install build-essential asciidoc binutils bzip2 curl gawk gettext git jq libncurses5-dev libz-dev patch unzip zip zlib1g-dev lib32gcc-s1 libc6-dev-i386 subversion flex uglifyjs git-core gcc-multilib p7zip p7zip-full msmtp libssl-dev texinfo libglib2.0-dev xmlto qemu-utils upx libelf-dev autoconf automake libtool autopoint device-tree-compiler
          sudo -E apt-get clean
          sudo rm -rf /var/lib/apt/lists/*
          df -h /

      - name: Clone exact official source
        if: steps.release.outputs.should_build == 'true'
        env:
          RELEASE_TAG: ${{ steps.release.outputs.release_tag }}
          EXPECTED_COMMIT: ${{ steps.release.outputs.source_commit }}
        run: |
          git clone --depth 1 --branch "${RELEASE_TAG}" https://github.com/x-wrt/x-wrt.git
          test "$(git -C x-wrt rev-parse HEAD)" = "${EXPECTED_COMMIT}"

      - name: Install matching official feeds
        if: steps.release.outputs.should_build == 'true'
        run: |
          cd x-wrt
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Apply Tenda BE12 Pro profile
        if: steps.release.outputs.should_build == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.release.outputs.release_tag }}
        run: |
          sh prepare-custom-packages.sh x-wrt
          sh profiles/tenda-be12-pro/configure.sh x-wrt "${RELEASE_TAG}"
          sh profiles/tenda-be12-pro/write-provenance.sh \
            x-wrt "${RELEASE_TAG}" build-manifest.txt
          cp x-wrt/.config x-wrt/feeds/x/rom/lede/config.nico-tenda-be12-pro

      - name: Build firmware
        if: steps.release.outputs.should_build == 'true'
        env:
          CONFIG_VERSION_NUMBER: ${{ steps.release.outputs.release_tag }}
        run: |
          cp build.sh upload.sh x-wrt/
          cd x-wrt
          bash build.sh "$(nproc)"

      - name: Upload failure log
        uses: actions/upload-artifact@v4
        if: failure() && steps.release.outputs.should_build == 'true'
        with:
          name: build-failure-log
          path: make.log

      - name: Upload firmware artifact
        if: steps.release.outputs.should_build == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: x-wrt-tenda-be12-pro=mediatek-filogic
          path: |
            x-wrt/rom/
            build-manifest.txt

      - name: Publish release assets
        if: steps.release.outputs.should_build == 'true'
        uses: ncipollo/release-action@v1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          tag: ${{ steps.release.outputs.release_tag }}
          name: X-WRT BE12 Pro ${{ steps.release.outputs.release_tag }}
          artifacts: x-wrt/rom/*.bin,x-wrt/rom/sha256sums.txt,build-manifest.txt
          allowUpdates: true
          removeArtifacts: true
          replacesArtifacts: true
