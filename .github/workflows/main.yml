name: x-wrt-ea0326gmp-k2p

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Official X-WRT tag; empty selects the newest tag.
        required: false
        type: string
      device:
        description: Device to build; all builds Nokia EA0326GMP and Phicomm K2P.
        type: choice
        default: all
        options:
          - all
          - nokia_ea0326gmp
          - phicomm_k2p
  push:
    branches:
      - ea0326gmp-k2p
    paths:
      - .gitattributes
      - .github/workflows/main.yml
      - profiles/ea0326gmp-k2p/**
      - build.sh
      - upload.sh
      - prepare-custom-packages.sh

permissions:
  contents: write

concurrency:
  group: x-wrt-ea0326gmp-k2p-${{ inputs.device || 'all' }}
  # A corrected push supersedes an obsolete build of the same device set.
  cancel-in-progress: ${{ github.event_name == 'push' }}

jobs:
  resolve:
    if: github.ref == 'refs/heads/ea0326gmp-k2p'
    runs-on: ubuntu-24.04
    outputs:
      release_tag: ${{ steps.release.outputs.release_tag }}
      source_commit: ${{ steps.release.outputs.source_commit }}
      matrix: ${{ steps.release.outputs.matrix }}
    steps:
      - name: Resolve official release and devices
        id: release
        env:
          INPUT_RELEASE_TAG: ${{ inputs.release_tag }}
          INPUT_DEVICE: ${{ inputs.device }}
        run: |
          set -eu
          release_tag="${INPUT_RELEASE_TAG}"
          case "${INPUT_DEVICE:-all}" in
            all) devices='nokia_ea0326gmp phicomm_k2p' ;;
            nokia_ea0326gmp|phicomm_k2p) devices="$INPUT_DEVICE" ;;
            *) echo "Unsupported device" >&2; exit 1 ;;
          esac
          if [ -z "$release_tag" ]; then
            release_tag="$(
              git ls-remote --tags --refs https://github.com/x-wrt/x-wrt.git |
                awk -F/ '{print $3}' |
                grep -E '^[0-9]+[.][0-9]+_b[0-9]{12}$' |
                sort -V | tail -n 1
            )"
          fi
          printf '%s\n' "$release_tag" | grep -Eq '^[0-9]+[.][0-9]+_b[0-9]{12}$'
          source_commit="$(
            git ls-remote --tags https://github.com/x-wrt/x-wrt.git \
              "refs/tags/${release_tag}" "refs/tags/${release_tag}^{}" |
              awk '$2 ~ /\^\{\}$/ { peeled = $1 } $2 !~ /\^\{\}$/ { tag = $1 }
                   END { if (peeled != "") print peeled; else print tag }'
          )"
          test -n "$source_commit"
          matrix="$(
            for device in $devices; do
              case "$device" in
                nokia_ea0326gmp) target=mediatek/filogic ;;
                phicomm_k2p) target=ramips/mt7621 ;;
              esac
              jq -cn --arg device "$device" --arg target "$target" '{device: $device, target: $target}'
            done | jq -cs '{include: .}'
          )"
          {
            echo "release_tag=$release_tag"
            echo "source_commit=$source_commit"
            echo "matrix=$matrix"
          } >>"$GITHUB_OUTPUT"

  build:
    needs: resolve
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.resolve.outputs.matrix) }}
    env:
      RELEASE_TAG: ${{ needs.resolve.outputs.release_tag }}
      DEVICE: ${{ matrix.device }}
      ASSET_TAG: ${{ matrix.device }}-${{ needs.resolve.outputs.release_tag }}
    steps:
      - name: Checkout EA0326GMP/K2P build definition
        uses: actions/checkout@v7

      - name: Initialize build environment
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo -E apt-get update
          sudo rm -rf /opt/hostedtoolcache /opt/ghc /usr/local/.ghcup \
            /usr/local/lib/android /usr/share/swift /usr/share/dotnet /etc/mysql /etc/php
          sudo -E apt-get -y --no-install-recommends install \
            bc bison build-essential bzip2 ca-certificates curl file flex \
            gawk gettext git jq libelf-dev libncurses-dev libssl-dev \
            patch perl pigz pkgconf python3 python3-dev python3-setuptools \
            rsync swig texinfo unzip wget xz-utils zlib1g-dev zstd
          sudo -E apt-get clean
          sudo rm -rf /var/lib/apt/lists/*
          df -h /

      - name: Clone exact official source
        env:
          EXPECTED_COMMIT: ${{ needs.resolve.outputs.source_commit }}
        run: |
          git clone --depth 1 --branch "$RELEASE_TAG" https://github.com/x-wrt/x-wrt.git x-wrt
          test "$(git -C x-wrt rev-parse HEAD)" = "$EXPECTED_COMMIT"

      - name: Install matching official feeds
        run: |
          cd x-wrt
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Apply applications and configuration
        run: |
          python3 -B profiles/ea0326gmp-k2p/test_configure.py
          python3 -B profiles/ea0326gmp-k2p/test_export_images.py x-wrt/scripts/json_add_image_info.py
          sh prepare-custom-packages.sh x-wrt
          sh profiles/ea0326gmp-k2p/configure.sh x-wrt "$RELEASE_TAG" "$DEVICE"
          sh profiles/ea0326gmp-k2p/write-provenance.sh x-wrt "$RELEASE_TAG" "$DEVICE" build-manifest.txt
          cp x-wrt/.config "$DEVICE.config"

      - name: Check build prerequisites
        run: make -C x-wrt prereq

      - name: Build firmware
        env:
          CONFIG_VERSION_NUMBER: ${{ needs.resolve.outputs.release_tag }}
          BUILD_DEVICE: ${{ matrix.device }}
        run: |
          cd x-wrt
          bash ../build.sh "$(nproc)"

      - name: Export and verify firmware
        env:
          CONFIG_VERSION_NUMBER: ${{ needs.resolve.outputs.release_tag }}
          BUILD_DEVICE: ${{ matrix.device }}
        run: |
          cd x-wrt
          sh ../upload.sh

      - name: Upload failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.device }}-failure-${{ github.run_id }}
          include-hidden-files: true
          path: |
            make.log
            x-wrt/logs/
            x-wrt/.config
            x-wrt/tmp/.config-package.in
            x-wrt/tmp/.packageinfo
            x-wrt/bin/targets/${{ matrix.target }}/*.itb
            x-wrt/bin/targets/${{ matrix.target }}/*.bin
            x-wrt/bin/targets/${{ matrix.target }}/*.json
            x-wrt/bin/targets/${{ matrix.target }}/*.manifest
            x-wrt/bin/targets/${{ matrix.target }}/sha256sums
            build-manifest.txt
          if-no-files-found: warn

      - name: Upload firmware and configuration artifact
        uses: actions/upload-artifact@v7
        with:
          name: x-wrt-${{ matrix.device }}-${{ needs.resolve.outputs.release_tag }}
          path: |
            x-wrt/rom/
            x-wrt/bin/targets/${{ matrix.target }}/profiles.json
            x-wrt/bin/targets/${{ matrix.target }}/*.manifest
            ${{ matrix.device }}.config
            build-manifest.txt
          if-no-files-found: error

      - name: Publish release assets
        uses: ncipollo/release-action@v1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          tag: ${{ env.ASSET_TAG }}
          commit: ${{ github.sha }}
          name: X-WRT ${{ matrix.device }} ${{ needs.resolve.outputs.release_tag }}
          # rom contains only checked firmware images and their checksum file.
          artifacts: x-wrt/rom/*,build-manifest.txt
          allowUpdates: true
          replacesArtifacts: true
          artifactErrorsFailBuild: true
