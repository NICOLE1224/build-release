name: scheduled-builds

# GitHub runs scheduled workflows only from the default branch. This workflow
# checks the four firmwares of the device branches and starts each branch's own
# main.yml for the ones that are out of date:
#   tenda-be12-pro  Tenda BE12 Pro
#   rax3000m        CMCC RAX3000M (cmcc_rax3000m layout)
#   ea0326gmp-k2p   Nokia EA0326GMP and Phicomm K2P
# All dispatched builds use the same, newest X-WRT tag.

on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:
    inputs:
      force:
        description: Build all four firmwares even if their releases are current.
        type: boolean
        default: false

permissions:
  actions: write
  contents: read

concurrency:
  group: scheduled-builds
  cancel-in-progress: false

jobs:
  dispatch:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout scheduler
        uses: actions/checkout@v7

      - name: Dispatch out-of-date firmware builds
        env:
          GH_TOKEN: ${{ github.token }}
          FORCE: ${{ inputs.force || false }}
        run: sh .github/schedule-builds.sh
